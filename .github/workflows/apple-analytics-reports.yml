name: Prepare official Apple Analytics reports

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-analytics-report-setup
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Validate encrypted report recipient
        env:
          REPORT_RECIPIENT: ${{ vars.KWS_MONITORING_REPORT_RECIPIENT }}
        run: |
          set -eu
          test -n "$REPORT_RECIPIENT"
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends age
          fi
          printf '' | age --encrypt --recipient "$REPORT_RECIPIENT" --output "$RUNNER_TEMP/recipient-check.age"
      - name: Ensure one ongoing report request for the exact KWS app
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: node ops/hostinger/monitoring/provider-readiness.mjs --ensure-apple-reports "$RUNNER_TEMP/apple-report-request.json"
      - name: Encrypt operator report
        if: always()
        env:
          REPORT_RECIPIENT: ${{ vars.KWS_MONITORING_REPORT_RECIPIENT }}
        run: |
          set -eu
          if [ -f "$RUNNER_TEMP/apple-report-request.json" ]; then
            age --encrypt --recipient "$REPORT_RECIPIENT" --output "$RUNNER_TEMP/apple-report-request.age" "$RUNNER_TEMP/apple-report-request.json"
            rm -- "$RUNNER_TEMP/apple-report-request.json"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: apple-report-request
          path: ${{ runner.temp }}/apple-report-request.age
          retention-days: 3
          if-no-files-found: error
