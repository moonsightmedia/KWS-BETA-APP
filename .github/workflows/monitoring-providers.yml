name: Monitoring provider readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-provider-readiness
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Validate encrypted report recipient
        env:
          REPORT_RECIPIENT: ${{ vars.KWS_MONITORING_REPORT_RECIPIENT }}
        run: |
          set -eu
          test -n "$REPORT_RECIPIENT"
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends age
          fi
          printf '' | age --encrypt --recipient "$REPORT_RECIPIENT" --output "$RUNNER_TEMP/recipient-check.age"
      - name: Read aggregate provider readiness
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.KWS_SENTRY_ORIGIN }}
        run: node ops/hostinger/monitoring/provider-readiness.mjs "$RUNNER_TEMP/provider-readiness.json"
      - name: Encrypt private provider metrics
        env:
          REPORT_RECIPIENT: ${{ vars.KWS_MONITORING_REPORT_RECIPIENT }}
        run: |
          set -eu
          age --encrypt --recipient "$REPORT_RECIPIENT" --output "$RUNNER_TEMP/provider-readiness.age" "$RUNNER_TEMP/provider-readiness.json"
          rm -- "$RUNNER_TEMP/provider-readiness.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: monitoring-provider-readiness
          path: ${{ runner.temp }}/provider-readiness.age
          retention-days: 3
          if-no-files-found: error
